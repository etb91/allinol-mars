<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abandoned, Not Forgotten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05060c; --ink:#f4f1ea; --muted:#a3a8bf; --accent:#ff8a3d; --accent-ink:#1a0b04;
    --bar:#11142a; --line:#262b4a; --panel:#f6f1e4; --panel-ink:#1c1b26; --link:#b13a0e;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#05060c; } }
  :root[data-theme="dark"]{ --bg:#05060c; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Baloo 2",system-ui,sans-serif;overflow:hidden}
  #app{position:fixed;inset:0;display:flex;flex-direction:column}
  #viewport{flex:1;position:relative;overflow:hidden}
  #stageWrap{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center}
  #stage{position:absolute;inset:0;width:1920px;height:1080px;background:#000;border-radius:4px}
  #stage.hot{cursor:pointer}
  .chip{position:absolute;transform:translate(-50%,-50%);font:800 30px "Baloo 2",sans-serif;padding:10px 30px;border:0;border-radius:999px;
    background:var(--accent);color:var(--accent-ink);cursor:pointer;box-shadow:0 8px 0 #a8461a;display:none;white-space:nowrap}
  .chip:hover{filter:brightness(1.08)}
  #endPanel{position:absolute;left:50%;top:958px;transform:translate(-50%,-50%);display:none;gap:14px;flex-wrap:wrap;justify-content:center;width:1700px}
  #endPanel button{font:800 28px "Baloo 2",sans-serif;padding:8px 26px;border-radius:999px;border:2px solid rgba(255,255,255,.25);background:rgba(10,12,30,.85);color:#fff;cursor:pointer}
  #endPanel button:hover{border-color:var(--accent)}
  #overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:rgba(3,4,10,.82);z-index:5;text-align:center}
  #overlay h1{margin:0;font-size:96px;line-height:1;letter-spacing:4px}
  #overlay h1 span{color:var(--accent)}
  #overlay p{margin:0;font-size:32px;color:var(--muted)}
  #overlay button{font:800 60px "Baloo 2",sans-serif;padding:16px 74px;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);cursor:pointer;box-shadow:0 10px 0 #a8461a}
  #overlay button:disabled{opacity:.45;cursor:wait}
  #modal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.66);z-index:6}
  #modal .box{position:relative;width:1300px;max-height:960px;overflow:auto;background:var(--panel);color:var(--panel-ink);border-radius:22px;padding:44px 56px;font-size:30px;line-height:1.4}
  #modal h3{margin:0 0 14px;font-size:56px;line-height:1.1}
  #modal a{color:var(--link)}
  #modal .close{position:absolute;right:22px;top:16px;font:800 30px "Baloo 2";border:0;background:#1c1b26;color:#fff;border-radius:999px;padding:6px 24px;cursor:pointer}
  .info{display:grid;grid-template-columns:520px 1fr;gap:36px;align-items:start}
  .info img{width:100%;border-radius:10px;display:block}
  .kind{display:inline-block;padding:2px 14px;border-radius:8px;color:#fff;font-size:22px;font-weight:800;letter-spacing:1px}
  .kind.real{background:#1f8a4c}.kind.ill{background:#c2410c}.kind.data{background:#2563eb}
  .muted{color:#5b5a68;font-size:24px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:28px}
  .cmp{position:relative;border-radius:12px;overflow:hidden;background:#000;user-select:none}
  .cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .cmp input{position:absolute;left:0;right:0;bottom:12px;width:90%;margin:0 5%;accent-color:var(--accent)}
  .cmp .lab{position:absolute;top:10px;padding:2px 12px;border-radius:8px;background:rgba(0,0,0,.65);color:#fff;font-size:22px;font-weight:800}
  .cmp .divider{position:absolute;top:0;bottom:0;width:4px;background:#fff;box-shadow:0 0 8px #000}
  table.cmpt{width:100%;border-collapse:collapse;font-size:26px}
  table.cmpt th,table.cmpt td{border-bottom:1px solid #d9d2c1;padding:8px 10px;text-align:left;vertical-align:top}
  table.cmpt th{font-size:28px}
  table.cmpt td:first-child{color:#5b5a68;font-weight:700;width:260px}
  .menu{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:10px}
  .menu button{font:800 32px "Baloo 2";padding:22px 16px;border-radius:18px;border:3px solid #1c1b26;background:#fff;color:#1c1b26;cursor:pointer}
  .menu button:hover{background:#ffe6d5}
  #digc{width:100%;border-radius:12px;display:block;touch-action:none;cursor:crosshair;background:#000}
  .digbar{display:flex;align-items:center;gap:20px;margin-top:14px}
  .digbar span{flex:1}
  .digbar button,.pbtn{font:800 30px "Baloo 2";padding:8px 28px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer}
  .digbar button:disabled{opacity:.4;cursor:not-allowed}
  .layers{display:grid;grid-template-columns:560px 1fr;gap:36px;align-items:center}
  .layers circle{cursor:pointer;stroke:#1c1b26;stroke-width:3}
  .layers circle:hover{filter:brightness(1.15)}
  ul.src{font-size:22px;line-height:1.5;padding-left:28px}
  .progress{width:100%;height:22px;border-radius:999px;background:#ddd5c4;overflow:hidden}
  .progress div{height:100%;width:0;background:var(--accent)}
  #bar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--bar);border-top:1px solid var(--line);font-size:15px}
  #bar button,#bar select{font:700 15px "Baloo 2",sans-serif;background:#232744;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer;white-space:nowrap}
  #bar button[aria-pressed="false"]{opacity:.5}
  #seek{flex:1;accent-color:var(--accent);min-width:80px}
  #time{font-variant-numeric:tabular-nums;color:var(--muted);min-width:96px;text-align:right}
  @media (max-width:700px){ #bar{flex-wrap:wrap} #seek{order:-1;flex-basis:100%} #chapters{max-width:130px} }
</style>
</head>
<body>
<div id="app">
  <div id="viewport">
    <div id="stageWrap">
      <canvas id="stage" width="1920" height="1080"></canvas>
      <button class="chip" id="chipDig" style="left:1560px;top:880px">⛏ Dig like Phoenix</button>
      <button class="chip" id="chipQuake" style="left:1150px;top:875px">🎧 Watch the full 30 s clip</button>
      <button class="chip" id="chipLayers" style="left:1290px;top:870px">🌍 Explore inside Mars</button>
      <div id="endPanel">
        <button data-open="dig">⛏ Dig like Phoenix</button>
        <button data-open="then">🕰 Then &amp; now</button>
        <button data-open="layers">🌍 Inside Mars</button>
        <button data-open="compare">📊 Compare the twins</button>
        <button data-open="quake">🎧 Hear the marsquake</button>
        <button data-open="sources">📚 Sources</button>
      </div>
      <div id="overlay">
        <h1>ABANDONED, <span>BUT NOT FORGOTTEN</span></h1>
        <p id="loadMsg">Loading pictures, voices and videos…</p>
        <button id="startBtn" disabled>▶ Play</button>
        <p style="font-size:24px">Click any photo for its story · ⛏ 🌍 🎧 extras along the way</p>
      </div>
      <div id="modal"><div class="box"><button class="close" id="modalClose">Close ✕</button><div id="modalBody"></div></div></div>
    </div>
  </div>
  <div id="bar">
    <button id="playBtn">▶ Oynat</button>
    <button id="restartBtn">⟲ Baştan</button>
    <input id="seek" type="range" min="0" max="200" step="0.01" value="0" aria-label="Zaman çizelgesi">
    <span id="time">0:00 / 0:00</span>
    <select id="chapters" aria-label="Bölümler"></select>
    <button id="ccBtn" aria-pressed="true">CC Altyazı</button>
    <button id="soundBtn" aria-pressed="true">🔊 Ses</button>
    <button id="exploreBtn">✨ Keşfet</button>
    <button id="exportBtn">⬇ MP4 dışa aktar</button>
  </div>
</div>

<script src="assets/vendor/mp4-muxer.js"></script>
<script>
'use strict';
/* ============================================================================
   Allinol — "Abandoned, but not forgotten": Phoenix & InSight
   One canvas renderer drives both the interactive page and the 1920x1080 60fps
   MP4 export, so everything on screen is a pure function of the time t.
   ========================================================================== */
const W = 1920, H = 1080, FPS = 60;
const $ = id => document.getElementById(id);

/* ---------------- math helpers ---------------- */
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, p) => a + (b - a) * p;
const ramp = (x, a, b) => clamp((x - a) / (b - a));
const E = {
  lin: x => x,
  out: x => 1 - Math.pow(1 - x, 3),
  in: x => x * x * x,
  io: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  back: x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
};
const appear = (c, at, d = .45) => E.out(ramp(c, at, at + d));
const popS = (c, at, d = .5) => c < at ? 0 : E.back(ramp(c, at, at + d));
const win = (c, a, b, f = .35) => Math.min(ramp(c, a, a + f), 1 - ramp(c, b - f, b));
function rng(seed) { let s = (seed >>> 0) || 1; return () => (s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296; }
const fmtTime = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

/* ---------------- content ---------------- */
const HELLO_AT = 2.47;      // the hello recording starts 2.47 s into the team intro (waveforms match)
const QUAKE_FROM = 3.0, LISTEN_DUR = 10.0, ENDCARD_DUR = 8.0, XF = .45;
const VOICE_GAIN = 1.25, QUAKE_GAIN = .55;
const BX = 170, BY = 905, BR = 112, BS = 262;   // "Allinol cam" badge

// d = length the timings below were measured on; if a clip is re-recorded, its

async function fetchBlob(url) { const r = await fetch(url); if (!r.ok) throw new Error(url + ' ' + r.status); return r.blob(); }
function makeVideo(blob) {
  return new Promise((res, rej) => {
    const v = document.createElement('video');
    v.muted = true; v.playsInline = true; v.preload = 'auto';
    v.addEventListener('loadeddata', () => res(v), {once: true});
    v.addEventListener('error', () => rej(new Error('video failed')), {once: true});
    v.src = URL.createObjectURL(blob);
  });
}
function seekVideo(v, time) {
  time = clamp(time, 0, Math.max(0, v.duration - .001));
  if (Math.abs(v.currentTime - time) < 1e-4 && v.readyState >= 2) return Promise.resolve();
  return new Promise(res => { v.addEventListener('seeked', () => res(), {once: true}); v.currentTime = time; });
}
async function loadAll(msg) {
  let done = 0; const total = Object.keys(IMGS).length + Object.keys(CLIPS).length + 4;
  const step = () => { done++; msg(`Loading… ${Math.round(done / total * 100)}%`); };
  await Promise.all(['800 64px "Baloo 2"','700 40px "Baloo 2"','600 30px "Baloo 2"','500 24px "Baloo 2"','700 48px "Caveat"'].map(f => document.fonts.load(f)));

  await Promise.all(Object.entries(CLIPS).map(async ([k, m]) => {
    BUF[k] = await ACTX.decodeAudioData(await (await fetchBlob('assets/voice/' + m.file)).arrayBuffer()); step();
  }).map(p => p.catch(e => { throw e; })));
  const quakeBlob = await fetchBlob(VIDEOS.quake.f);
  BUF.quake = await ACTX.decodeAudioData(await quakeBlob.arrayBuffer()); step();
  VID.quake = await makeVideo(quakeBlob); step();
  VID.intro = await makeVideo(await fetchBlob(VIDEOS.intro.f)); step();
  INTRO_END = VID.intro.duration;
  await buildTalkSprites(); step();
  buildArt();
  buildQuakeEnvelope();

}
// The talking loop comes from the last 1.3 s of the team intro (black background).
async function buildTalkSprites() {
  const v = VID.intro, T0 = 7.30, N = Math.floor((INTRO_END - .01 - T0) * 30) + 1;
  const small = new OffscreenCanvas(480, 270), sg = small.getContext('2d', {willReadFrequently: true});
  for (let i = 0; i < N; i++) {
    await seekVideo(v, T0 + i / 30);
    sg.drawImage(v, 0, 0, 480, 270);
    const d = sg.getImageData(0, 0, 480, 270).data;
    let x0 = 1e9, y0 = 1e9, x1 = -1, y1 = -1;
    for (let y = 0; y < 270; y++) for (let x = 0; x < 480; x++) {
      const o = (y * 480 + x) * 4, r = d[o], gr = d[o + 1], b = d[o + 2];
      if (b > 90 && b > r + 40 && b > gr + 40) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    }
    const cx = x1 >= 0 ? (x0 + x1) / 2 * 4 : 960, cy = y1 >= 0 ? (y0 + y1) / 2 * 4 : 500;
    const spr = new OffscreenCanvas(480, 480), pg = spr.getContext('2d');
    pg.fillStyle = '#000'; pg.fillRect(0, 0, 480, 480);

}
function buildQuakeEnvelope() {
  const b = BUF.quake, d = b.getChannelData(0), hop = Math.round(b.sampleRate / 30);

}

/* ---------------- overlays ---------------- */
function talkFrame(t) {
  const N = TALK.length; if (!N) return 0;
  if (!isTalking(t)) return Math.min(N - 1, 21);
  const per = 2 * (N - 1), k = Math.floor((t - INTRO_END) * 30) + (N - 1), m = ((k % per) + per) % per;
  return m <= N - 1 ? m : per - m;
}
function drawBadge(t) {
  if (t < INTRO_END || !TALK.length) return;
  const last = TALK[TALK.length - 1], p = E.io(ramp(t, INTRO_END, INTRO_END + 1.25)), pr = E.out(ramp(t, INTRO_END, INTRO_END + 1.0));
  let cx = lerp(last.cx, BX, p), cy = lerp(last.cy, BY, p), size = lerp(640, BS, p), R = lerp(980, BR, pr);
  const q = TL ? E.io(ramp(t, TL.endcard + .8, TL.endcard + 2.0)) : 0;
  if (q > 0) { cx = lerp(cx, W / 2, q); cy = lerp(cy, 640, q); size = lerp(size, BS * 1.45, q); R = lerp(R, BR * 1.45, q); }
  const fo = MODE === 'export' && TL ? 1 - ramp(t, TL.total - 1.2, TL.total) : 1;
  const bob = Math.sin(t * 2.1) * 4 * p;
  g.save(); g.globalAlpha = fo;
  circlePath(cx, cy + bob, R); g.fillStyle = '#000'; g.fill();
  g.save(); circlePath(cx, cy + bob, R); g.clip(); g.drawImage(TALK[talkFrame(t)].bmp, cx - size / 2, cy + bob - size / 2, size, size); g.restore();
  g.globalAlpha = fo * pr; g.lineWidth = 6; g.strokeStyle = '#ff8a3d'; circlePath(cx, cy + bob, R); g.stroke();
  g.restore();
}

      if (err) throw err;
      const t = from + i / fps;
      await prepVideosExact(t);
      renderFrame(Math.min(t, TL.total - 1e-4));
      const fr = new VideoFrame(CANVAS, {timestamp: Math.round(i * 1e6 / fps), duration: Math.round(1e6 / fps)});
      ve.encode(fr, {keyFrame: i % (fps * 2) === 0}); fr.close();
      while (ve.encodeQueueSize > 6) await new Promise(r => ve.addEventListener('dequeue', r, {once: true}));
      if (i % 15 === 0) onProgress(.92 * i / N, `Video frame ${i} / ${N}`, (performance.now() - t0) / 1000);
    }
    await ve.flush(); ve.close();
    if (err) throw err;
    onProgress(.93, 'Mixing audio…');
    const mix = await renderMix();
    const ae = new AudioEncoder({output: (ch, meta) => muxer.addAudioChunk(ch, meta), error: e => { err = e; }});
    ae.configure({codec: 'mp4a.40.2', sampleRate: 48000, numberOfChannels: 2, bitrate: 192000});
    const L = mix.getChannelData(0), R = mix.getChannelData(1), s0 = Math.round(from * 48000), s1 = Math.min(mix.length, Math.round(to * 48000));
    for (let off = s0; off < s1; off += 4800) {
      const n = Math.min(4800, s1 - off), data = new Float32Array(n * 2);
      data.set(L.subarray(off, off + n), 0); data.set(R.subarray(off, off + n), n);
      const ad = new AudioData({format: 'f32-planar', sampleRate: 48000, numberOfFrames: n, numberOfChannels: 2, timestamp: Math.round((off - s0) * 1e6 / 48000), data});
      ae.encode(ad); ad.close();
    }
    await ae.flush(); ae.close();
    if (err) throw err;
    muxer.finalize();
    onProgress(.97, 'Saving…');
    let saved = null, bytes = 0;
    if (streaming) {
      await queue; if (writeErr) throw writeErr;
      saved = 'output/' + name; bytes = written;
    } else {
      const buf = target.buffer; bytes = buf.byteLength;
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([buf], {type: 'video/mp4'})); a.download = name; a.click();
      saved = '(browser download) ' + name;
    }
    if (!opts.from && !opts.to) {
      try { await fetch('/save?name=' + encodeURIComponent(name.replace(/\.mp4$/, '.srt')), {method: 'POST', body: srt()}); } catch (e) {}
    }
    onProgress(1, 'Done', (performance.now() - t0) / 1000);
    return {saved, bytes, frames: N, codec, seconds: (performance.now() - t0) / 1000};
  } finally { BUSY = false; MODE = 'live'; }
}
$('exportBtn').onclick = async () => {
  openModal(`<h3>Exporting MP4…</h3><p class="muted">1920×1080 · 60 fps · H.264 + AAC. Keep this window visible until it finishes.</p><div class="progress"><div id="pb"></div></div><p id="pmsg">Starting…</p>`);
  $('modalClose').style.display = 'none';
  try {
    const r = await exportMP4((p, msg, el) => { $('pb').style.width = (p * 100).toFixed(1) + '%'; $('pmsg').textContent = msg + (el ? ` · ${el.toFixed(0)} s` : ''); });
    $('pmsg').innerHTML = `Saved: <b>${esc(r.saved)}</b> (${(r.bytes / 1e6).toFixed(1)} MB, ${r.frames} frames). Subtitles saved next to it as .srt.`;
  } catch (e) { $('pmsg').textContent = 'Export failed: ' + e.message; }
  $('modalClose').style.display = '';
};

/* ---------------- debug hooks (frame grabs for checking) ---------------- */
window.__dbg = {
  get TL() { return TL; },
  async sheet(times, name, cols = 4, w = 480) {
    BUSY = true; pause(); MODE = 'export';
    try {
      const h = Math.round(w * 9 / 16), rows = Math.ceil(times.length / cols), cv = new OffscreenCanvas(cols * w, rows * (h + 26)), x = cv.getContext('2d');
      x.fillStyle = '#111'; x.fillRect(0, 0, cv.width, cv.height);
      for (let i = 0; i < times.length; i++) {
        const t = times[i]; await prepVideosExact(t); renderFrame(t);
        const ox = (i % cols) * w, oy = Math.floor(i / cols) * (h + 26);
        x.drawImage(CANVAS, ox, oy + 26, w, h); x.fillStyle = '#fff'; x.font = '16px sans-serif'; x.fillText(`${t.toFixed(2)}s · ${TL.scenes[sceneIndexAt(t)].id}`, ox + 6, oy + 18);
      }
      const blob = await cv.convertToBlob({type: 'image/png'});
      return (await fetch('/save?dir=debug&name=' + encodeURIComponent(name), {method: 'POST', body: blob})).json();
    } finally { BUSY = false; MODE = 'live'; }
  },
  async frame(t, name) {
    BUSY = true; pause(); MODE = 'export';
    try { await prepVideosExact(t); renderFrame(t);
      const b = await new Promise(r => CANVAS.toBlob(r, 'image/jpeg', .9));
      return (await fetch('/save?dir=debug&name=' + encodeURIComponent(name), {method: 'POST', body: b})).json();
    } finally { BUSY = false; MODE = 'live'; }
  },
  exportMP4,
  srt: () => srt(),
};

/* ---------------- boot ---------------- */
(async () => {
  try {
    await loadAll(m => { $('loadMsg').textContent = m; });
    buildChapters();
    $('loadMsg').textContent = `Ready · ${fmtTime(TL.total)}`;
    $('startBtn').disabled = false;
    requestAnimationFrame(loop);
  } catch (e) {
    console.error(e); $('loadMsg').textContent = 'Could not load: ' + e.message + ' (open it through tools/server.py)';
  }
})();
</script>
