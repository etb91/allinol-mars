<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abandoned, Not Forgotten</title>
<meta name="description" content="An interactive documentary about NASA's Phoenix and InSight landers on Mars.">
<meta name="theme-color" content="#0B0D14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Allinol">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
<style>
  /* Palette: two main colors + one accent. */
  :root{
    --ink:#0B0D14;          /* space black, a little navy in it */
    --paper:#F2F0EA;        /* paper white, a little warm */
    --red:#FC3D21;          /* NASA red: the only accent */
    --paper-70:rgba(242,240,234,.7); --paper-40:rgba(242,240,234,.4); --paper-15:rgba(242,240,234,.15);
    --ink-70:rgba(11,13,20,.7); --ink-20:rgba(11,13,20,.2);
    --text:"Helvetica Neue",Helvetica,Arial,sans-serif;
    --display:"Arial Black","Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --ink:#0B0D14; } }
  :root[data-theme="dark"]{ --ink:#0B0D14; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);font-family:var(--text);overflow:hidden;-webkit-text-size-adjust:100%}
  #app{position:fixed;inset:0;height:100dvh;display:flex;flex-direction:column;background:var(--ink);
    padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
  #viewport{flex:1;position:relative;overflow:hidden}
  #stageWrap{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center}
  #stage{position:absolute;inset:0;width:1920px;height:1080px;background:#000;display:block}
  #stage.hot{cursor:pointer}
  button{font-family:var(--text)}
  .chip{position:absolute;transform:translate(-50%,-50%);font:700 26px var(--text);letter-spacing:.08em;text-transform:uppercase;padding:14px 26px;
    border:2px solid var(--paper);border-radius:0;background:var(--ink-70);color:var(--paper);cursor:pointer;display:none;white-space:nowrap}
  .chip:hover,.chip:focus-visible{border-color:var(--red);outline:none}
  #endPanel{position:absolute;left:96px;right:96px;top:960px;display:none;gap:12px;flex-wrap:wrap;justify-content:center}
  #endPanel button{font:700 24px var(--text);letter-spacing:.06em;text-transform:uppercase;padding:12px 22px;border:2px solid var(--paper-40);border-radius:0;background:var(--ink);color:var(--paper);cursor:pointer}
  #endPanel button:hover,#endPanel button:focus-visible{border-color:var(--red);outline:none}
  #overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:0;padding:0 96px;background:rgba(11,13,20,.94);z-index:5}
  #overlay .rule{width:120px;height:8px;background:var(--red);margin-bottom:40px}
  #overlay h1{margin:0;font:800 104px/1.02 var(--display);letter-spacing:.01em;text-transform:uppercase;color:var(--paper)}
  #overlay p{margin:28px 0 0;font:400 34px/1.35 var(--text);color:var(--paper-70);max-width:1100px}
  #overlay .row{display:flex;align-items:center;gap:32px;margin-top:56px}
  #overlay button{font:700 34px var(--text);letter-spacing:.1em;text-transform:uppercase;padding:22px 64px;border:0;border-radius:0;background:var(--red);color:var(--ink);cursor:pointer}
  #overlay button:disabled{background:var(--paper-15);color:var(--paper-40);cursor:wait}
  #overlay .hint{margin:0;font:400 26px var(--text);color:var(--paper-40)}
  #rotateHint{position:absolute;left:0;right:0;top:0;padding:14px 18px;background:var(--red);color:var(--ink);font:700 15px var(--text);letter-spacing:.06em;text-transform:uppercase;display:none;z-index:8;justify-content:space-between;align-items:center;gap:10px}
  #rotateHint button{font:700 14px var(--text);border:2px solid var(--ink);background:transparent;color:var(--ink);padding:4px 10px;border-radius:0;cursor:pointer}
  #modal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(11,13,20,.8);z-index:6}
  #modal .box{position:relative;width:1340px;max-height:960px;overflow:auto;background:var(--paper);color:var(--ink);border-radius:0;padding:56px 64px;font:400 28px/1.45 var(--text)}
  #modal h3{margin:0 0 18px;font:700 52px/1.1 var(--text);letter-spacing:-.01em}
  #modal a{color:var(--ink);text-decoration-color:var(--red);text-decoration-thickness:3px;text-underline-offset:4px}
  #modal .close{position:absolute;right:24px;top:22px;font:700 20px var(--text);letter-spacing:.1em;text-transform:uppercase;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:0;padding:8px 18px;cursor:pointer}
  #modal .close:hover{background:var(--ink);color:var(--paper)}
  .info{display:grid;grid-template-columns:540px 1fr;gap:44px;align-items:start}
  .info img,.info video{width:100%;display:block;border:1px solid var(--ink-20)}
  .kind{display:inline-block;padding:4px 10px;font:700 16px var(--text);letter-spacing:.14em;border:2px solid var(--ink);color:var(--ink)}
  .kind.ill{background:var(--red);border-color:var(--red)}
  .fig{font:700 18px var(--text);letter-spacing:.12em;color:var(--red);margin-left:12px}
  .muted{color:rgba(11,13,20,.62);font-size:22px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:32px}
  .cmp{position:relative;overflow:hidden;background:#000;user-select:none;border:1px solid var(--ink-20)}
  .cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .cmp input{position:absolute;left:5%;right:5%;bottom:14px;width:90%;accent-color:var(--red)}
  .cmp .lab{position:absolute;top:12px;padding:3px 10px;background:var(--ink);color:var(--paper);font:700 16px var(--text);letter-spacing:.1em;text-transform:uppercase}
  .cmp .divider{position:absolute;top:0;bottom:0;width:3px;background:var(--paper)}
  table.cmpt{width:100%;border-collapse:collapse;font-size:24px}
  table.cmpt th,table.cmpt td{border-bottom:1px solid var(--ink-20);padding:10px 12px;text-align:left;vertical-align:top}
  table.cmpt th{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:20px;border-bottom:3px solid var(--ink)}
  table.cmpt td:first-child{color:rgba(11,13,20,.62);width:260px}
  .menu{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:22px;border-top:3px solid var(--ink)}
  .menu button{font:700 26px var(--text);text-align:left;padding:26px 22px;border:0;border-bottom:1px solid var(--ink-20);background:transparent;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;align-items:center}
  .menu button::after{content:"→";color:var(--red)}
  .menu button:hover{background:rgba(11,13,20,.06)}
  #digc{width:100%;display:block;touch-action:none;cursor:crosshair;background:#000}
  .digbar{display:flex;align-items:center;gap:20px;margin-top:16px}
  .digbar span{flex:1}
  .pbtn,.digbar button{font:700 22px var(--text);letter-spacing:.1em;text-transform:uppercase;padding:12px 26px;border:0;border-radius:0;background:var(--red);color:var(--ink);cursor:pointer}
  .digbar button:disabled{background:var(--ink-20);color:rgba(11,13,20,.4);cursor:not-allowed}
  .layers{display:grid;grid-template-columns:560px 1fr;gap:44px;align-items:center}
  .layers circle{cursor:pointer}
  .layers circle:hover{opacity:.85}
  ul.src{font-size:20px;line-height:1.5;padding-left:24px}
  .progress{width:100%;height:12px;background:var(--ink-20)}
  .progress div{height:100%;width:0;background:var(--red)}
  #bar{display:flex;align-items:center;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--ink);border-top:1px solid var(--paper-15);font-size:14px;transition:transform .25s ease, opacity .25s ease}
  #bar button,#bar select{font:700 13px var(--text);letter-spacing:.06em;text-transform:uppercase;background:transparent;color:var(--paper);border:1px solid var(--paper-40);border-radius:0;padding:8px 11px;cursor:pointer;white-space:nowrap;min-height:36px}
  #bar select{text-transform:none;letter-spacing:0;font-weight:400;max-width:260px}
  #bar #playBtn{background:var(--red);border-color:var(--red);color:var(--ink);min-width:84px}
  #bar button[aria-pressed="false"]{opacity:.45}
  #bar button:hover,#bar select:hover{border-color:var(--paper)}
  #seek{flex:1;accent-color:var(--red);min-width:80px}
  #time{font-variant-numeric:tabular-nums;color:var(--paper-70);min-width:92px;text-align:right}
  body.immersive #app{padding:0}
  body.immersive #bar{position:absolute;left:0;right:0;bottom:0;z-index:7;background:rgba(11,13,20,.9)}
  body.immersive.idle #bar{transform:translateY(100%);opacity:0;pointer-events:none}
  body.immersive.idle #viewport{cursor:none}
  @media (max-width:900px){ #bar{flex-wrap:wrap} #seek{order:-1;flex-basis:100%} #chapters{max-width:150px} }
  /* phones held sideways: one slim row so the picture gets the height */
  @media (max-height:520px){
    #bar{flex-wrap:nowrap;gap:6px;padding:6px 10px calc(6px + env(safe-area-inset-bottom))}
    #seek{order:0;flex-basis:auto}
    #restartBtn,#chapters,#exportBtn,#time{display:none}
    #bar button{padding:6px 9px;min-height:32px;font-size:12px}
    #bar #playBtn{min-width:64px}
  }
</style>
</head>
<body>
<div id="app">
  <div id="viewport">
    <div id="rotateHint"><span>Turn your phone sideways for the full picture</span><button id="rotateOk">OK</button></div>
    <div id="stageWrap">
      <canvas id="stage" width="1920" height="1080"></canvas>
      <button class="chip" id="chipDig" style="left:1580px;top:880px">Try it: dig like Phoenix</button>
      <button class="chip" id="chipQuake" style="left:1444px;top:830px">Watch the full 30 s clip</button>
      <button class="chip" id="chipLayers" style="left:1292px;top:880px">Explore inside Mars</button>
      <div id="endPanel">
        <button data-open="dig">Dig like Phoenix</button>
        <button data-open="then">Then and now</button>
        <button data-open="layers">Inside Mars</button>
        <button data-open="compare">Compare the twins</button>
        <button data-open="quake">Hear the marsquake</button>
        <button data-open="sources">Sources</button>
      </div>
      <div id="overlay">
        <div class="rule"></div>
        <h1>Abandoned,<br>but not forgotten</h1>
        <p>Two NASA landers went silent on Mars. This is the story of Phoenix and InSight, and of what they found.</p>
        <div class="row"><button id="startBtn" disabled>Play</button><p class="hint" id="loadMsg">Loading…</p></div>
        <p class="hint" style="margin-top:28px">Click any photo for its story. Full screen button below.</p>
      </div>
      <div id="modal" role="dialog" aria-modal="true"><div class="box"><button class="close" id="modalClose">Close</button><div id="modalBody"></div></div></div>
    </div>
  </div>
  <div id="bar">
    <button id="playBtn">Play</button>
    <button id="restartBtn">Restart</button>
    <input id="seek" type="range" min="0" max="200" step="0.01" value="0" aria-label="Timeline">
    <span id="time">0:00 / 0:00</span>
    <select id="chapters" aria-label="Chapters"></select>
    <button id="ccBtn" aria-pressed="true">Subtitles</button>
    <button id="soundBtn" aria-pressed="true">Sound</button>
    <button id="exploreBtn">Explore</button>
    <button id="fsBtn">Full screen</button>
    <button id="exportBtn" hidden>Export MP4</button>
  </div>
</div>

<script src="assets/vendor/mp4-muxer.js"></script>
<script>
'use strict';
/* ============================================================================
   Allinol — "Abandoned, but not forgotten": Phoenix & InSight
   One canvas renderer drives both the interactive page and the 1920x1080 60fps
   MP4 export, so everything on screen is a pure function of the time t.
   Design: mission-archive style. Ink + paper, NASA red as the only accent.
   Arial Black for display type, Helvetica for everything else.
   ========================================================================== */
const W = 1920, H = 1080, FPS = 60;
const $ = id => document.getElementById(id);

/* ---------------- design tokens ---------------- */
const INK = '#0B0D14', PAPER = '#F2F0EA', RED = '#FC3D21', RED_DEEP = '#90271B';
const pa = a => `rgba(242,240,234,${a})`, ia = a => `rgba(11,13,20,${a})`, ra = a => `rgba(252,61,33,${a})`;
const F_TEXT = '"Helvetica Neue", Helvetica, Arial, sans-serif';
const F_DISP = '"Arial Black", "Helvetica Neue", Helvetica, Arial, sans-serif';
const M = 96, R = W - 96;                 // page margins (12-column grid inside)

/* ---------------- math helpers ---------------- */
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, p) => a + (b - a) * p;
const ramp = (x, a, b) => clamp((x - a) / (b - a));
const E = {
  lin: x => x,
  out: x => 1 - Math.pow(1 - x, 3),
  in: x => x * x * x,
  io: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
};
const appear = (c, at, d = .5) => E.out(ramp(c, at, at + d));
const win = (c, a, b, f = .35) => Math.min(ramp(c, a, a + f), 1 - ramp(c, b - f, b));
const rise = (c, at, d = .5) => { const p = E.out(ramp(c, at, at + d)); return {a: p, dy: (1 - p) * 24}; };
function rng(seed) { let s = (seed >>> 0) || 1; return () => (s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296; }
const fmtTime = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const pad2 = n => String(n).padStart(2, '0');

/* ---------------- content ---------------- */
const HELLO_AT = 2.47;      // the hello recording starts 2.47 s into the team intro (waveforms match)
const QUAKE_FROM = 3.0, LISTEN_DUR = 10.0, ENDCARD_DUR = 8.0, XF = .45;
const VOICE_GAIN = 1.25, QUAKE_GAIN = .55, SFX_BOOST = 1.8, LIVE_GAIN = .84;   // LIVE_GAIN keeps live playback from clipping, like the export's peak limit
const BX = 192, BY = 936, BR = 96, BS = 226;   // "Allinol cam" badge, bottom-left on the grid

// d = length the timings below were measured on; if a clip is re-recorded, its
// timings are stretched to the new length automatically.
const CLIPS = {
  '01': {file: '01-hello-everyone.mp3', d: 11.65, sp: [[.06,.90],[1.12,2.56],[3.04,7.92],[8.50,9.60],[9.82,10.34],[10.60,11.14]],
    subs: [[.06,2.56,'Hello everyone, this is Allinol with you!'],[3.04,7.92,'Today, we will talk about 2 Mars landers that have been used by NASA years ago.'],[8.50,11.14,'They are designated as “InSight” and “Phoenix”.']]},
  '02': {file: '02-both-of-them.mp3', d: 5.41, sp: [[.02,4.98]],
    subs: [[.02,4.98,'Both of them were built up to land on Martian surface and conduct scientific experiments.']]},
  '03': {file: '03-closer-look.mp3', d: 2.35, sp: [[.06,.44],[.76,2.12]], subs: [[.06,2.12,'Now, let’s take a closer look.']]},
  '04': {file: '04-first-up-phoenix.mp3', d: 2.43, sp: [[.12,.58],[.94,1.44],[1.70,1.92]], subs: [[.12,1.92,'First up, we have Phoenix.']]},
  '05': {file: '05-phoenix-primary-mission.mp3', d: 19.07, sp: [[.10,6.72],[7.12,9.18],[9.74,12.94],[13.44,13.80],[14.14,18.88]],
    subs: [[.10,4.25,'The primary mission objectives of the Phoenix lander were to directly reach'],[4.25,6.72,'the subsurface water ice detected from orbit'],[7.12,9.18,'and confirm its chemical composition,'],[9.74,12.94,'study whether the environment is suitable for microbial life'],[13.44,18.88,'and study weather events alongside the water cycle within the Martian polar atmosphere.']]},
  '06': {file: '06-phoenix-launched.mp3', d: 13.71, sp: [[.10,2.42],[2.66,3.66],[4.14,8.12],[8.60,10.14],[10.42,11.28],[11.64,13.34]],
    subs: [[.10,3.66,'It was launched from Florida on August 4, 2007.'],[4.14,8.12,'It flew for 295 days before arriving at the Mars,'],[8.60,13.34,'and on the date of May 25, 2008, it landed on Martian surface.']]},
  '07': {file: '07-phoenix-when-it-landed.mp3', d: 3.63, sp: [[.06,.94],[1.20,2.48],[2.78,3.38]], subs: [[.06,3.38,'When it landed, it was as heavy as a polar bear.']]},
  '08': {file: '08-phoenix-monumental-role.mp3', d: 21.47, sp: [[.12,4.14],[4.58,8.58],[9.26,15.96],[16.44,19.80],[19.98,21.12]],
    subs: [[.12,4.14,'Phoenix played a monumental role in the history of Mars exploration,'],[4.58,8.58,'most notably by providing definitive proof of water on the Red Planet.'],[9.26,12.75,'By using its robotic arm to trench into the subsurface'],[12.75,15.96,'and analyzing the samples with its onboard thermal laboratory,'],[16.44,21.12,'the lander definitively confirmed the presence of water ice just beneath the surface.']]},
  '09': {file: '09-phoenix-even-though.mp3', d: 8.05, sp: [[.08,3.90],[4.48,6.00],[6.18,7.68]],
    subs: [[.08,3.90,'Even though it was estimated to work sufficiently for 90 Martian days,'],[4.48,7.68,'Phoenix worked for 151 Martian days!']]},
  '10': {file: '10-building-directly.mp3', d: 11.96, sp: [[.04,4.62],[5.08,7.36],[7.54,10.06],[10.32,11.70]],
    subs: [[.04,4.62,'Building directly on Phoenix’s proven lander design and engineering heritage,'],[5.08,7.36,'NASA launched InSight a decade later'],[7.54,11.70,'to shift the focus from Mars’ icy surface to its deep interior.']]},
  '11': {file: '11-insight-lifted-off.mp3', d: 4.36, sp: [[.04,2.94],[3.20,4.06]], subs: [[.04,4.06,'InSight lifted off from California on May 5, 2018.']]},
  '12': {file: '12-insight-after-205.mp3', d: 7.00, sp: [[.08,2.88],[3.24,5.58],[5.90,6.80]],
    subs: [[.08,2.88,'After a 205-day flight through space,'],[3.24,6.80,'it landed on Mars on November 26, 2018.']]},
  '13': {file: '13-insight-after-landing.mp3', d: 3.40, sp: [[.04,3.08]], subs: [[.04,3.08,'After the landing, it was as tall as a giraffe!']]},
  '14': {file: '14-insight-primary-mission.mp3', d: 29.07, sp: [[.10,4.50],[4.96,7.96],[8.58,10.34],[10.70,13.10],[13.68,15.14],[15.42,17.48],[17.96,21.62],[22.10,24.46],[24.94,25.68],[25.98,26.34],[26.82,28.58]],
    subs: [[.10,4.50,'Its primary mission goals were to study the structure of Mars’ interior layers,'],[4.96,7.96,'measure tectonic activity and meteorite impact rates,'],[8.58,13.10,'track geological evolution, and understand how rocky planets form.'],[13.68,17.48,'Over its four-year mission, InSight achieved major discoveries,'],[17.96,21.62,'including recording more than 1,300 marsquakes,'],[22.10,24.46,'confirming that the planet’s core is liquid,'],[24.94,28.58,'measuring the crust’s thickness, and listening to meteorite impacts.']]},
  '15': {file: '15-in-the-end.mp3', d: 18.76, sp: [[.10,.74],[1.08,5.72],[6.36,8.12],[8.76,11.26],[11.52,14.18],[14.58,18.46]],
    subs: [[.10,5.72,'In the end, after putting in such an amazing effort and making groundbreaking contributions,'],[6.36,8.12,'both missions came to a close;'],[8.76,11.26,'Phoenix froze during the dark Martian winter'],[11.52,14.18,'while InSight’s solar panels were covered in dust,'],[14.58,18.46,'draining its power and leaving both landers abandoned on the Red Planet.']]},
};

const KIND = {real: 'REAL PHOTO', ill: 'ILLUSTRATION', data: 'REAL DATA'};
const nasa = id => `https://images.nasa.gov/details/${id}`;
const IMGS = {
  'insight-art':      {f:'insight-art.jpg', id:'PIA22228', kind:'ill', credit:'NASA/JPL-Caltech', title:'InSight on the Surface of Mars', date:'Artist’s illustration (2018)', desc:'An artist’s illustration of the InSight lander working on Mars, with its two round solar panels open.'},
  'phoenix-selfie':   {f:'phoenix-selfie.jpg', id:'PIA11719', kind:'real', credit:'NASA/JPL-Caltech/University of Arizona/Texas A&M University', title:'Phoenix Lander Self Portrait on Mars', date:'Mosaic of Phoenix’s own pictures, 2008', desc:'Phoenix photographed itself piece by piece; the pictures were stitched into this view from above.'},
  'phoenix-site':     {f:'phoenix-site.jpg', id:'PIA10718', kind:'ill', credit:'NASA/JPL-Caltech/University of Arizona', title:'Phoenix Work Area Animation', date:'Frame from an animation (May 2008)', desc:'A rendered Phoenix lander placed on a real mosaic of its digging area, taken on its first day on Mars.'},
  'phx-launch-1':     {f:'phx-launch-1.jpg', id:'KSC-07pd2174', kind:'real', credit:'NASA', title:'Phoenix lifts off', date:'August 4, 2007 · 5:26 a.m. EDT', desc:'A Delta II rocket carries Phoenix away from Pad 17-A at Cape Canaveral Air Force Station, Florida.'},
  'phx-launch-2':     {f:'phx-launch-2.jpg', id:'KSC-07pd2181', kind:'real', credit:'NASA', title:'Delta II liftoff', date:'August 4, 2007', desc:'The Delta II rocket carrying Phoenix rises amid billows of smoke at Cape Canaveral, Florida.'},
  'phx-parachute':    {f:'phx-parachute.jpg', id:'PIA10705', kind:'real', credit:'NASA/JPL-Caltech/University of Arizona', title:'Phoenix Descending with Crater in the Background', date:'May 25, 2008', desc:'The HiRISE camera on Mars Reconnaissance Orbiter caught Phoenix hanging from its parachute (see the inset). It looks like it is falling into the 10 km crater “Heimdall”, but it was really about 20 km in front of it.'},

/* ---------------- loading ---------------- */
async function fetchBlob(url) { const r = await fetch(url); if (!r.ok) throw new Error(url + ' ' + r.status); return r.blob(); }
function makeVideo(blob) {
  return new Promise((res, rej) => {
    const v = document.createElement('video');
    v.muted = true; v.playsInline = true; v.setAttribute('playsinline', ''); v.preload = 'auto';
    v.addEventListener('loadeddata', () => res(v), {once: true});
    v.addEventListener('error', () => rej(new Error('video failed')), {once: true});
    v.src = URL.createObjectURL(blob);
  });
}
function seekVideo(v, time) {
  time = clamp(time, 0, Math.max(0, v.duration - .001));
  if (Math.abs(v.currentTime - time) < 1e-4 && v.readyState >= 2) return Promise.resolve();
  return new Promise(res => { v.addEventListener('seeked', () => res(), {once: true}); v.currentTime = time; });
}
async function loadAll(msg) {
  let done = 0; const total = Object.keys(IMGS).length + Object.keys(CLIPS).length + 6;
  const step = () => { done++; msg(`Loading… ${Math.round(done / total * 100)}%`); };
  await Promise.all([`800 64px ${F_DISP}`, `700 40px ${F_TEXT}`, `400 30px ${F_TEXT}`].map(f => document.fonts.load(f)));
  ACTX = new AudioContext();
  await Promise.all(Object.entries(IMGS).map(async ([k, m]) => { IMG[k] = await createImageBitmap(await fetchBlob('assets/img/' + m.f)); step(); }));
  await Promise.all(Object.entries(CLIPS).map(async ([k, m]) => {
    BUF[k] = await ACTX.decodeAudioData(await (await fetchBlob('assets/voice/' + m.file)).arrayBuffer()); step();
  }));
  const quakeBlob = await fetchBlob(VIDEOS.quake.f);
  BUF.quake = await ACTX.decodeAudioData(await quakeBlob.arrayBuffer()); step();
  VID.quake = await makeVideo(quakeBlob); step();
  VID.intro = await makeVideo(await fetchBlob(VIDEOS.intro.f)); step();
  INTRO_END = VID.intro.duration;
  BUF['mars-wind'] = await ACTX.decodeAudioData(await (await fetchBlob(AUDIOS['mars-wind'].f)).arrayBuffer()); step();
  Object.assign(BUF, await synthSFX()); step();
  await buildTalkSprites(); step();
  buildArt();
  buildQuakeEnvelope();
  buildTimeline();
}
// The talking loop comes from the last 1.3 s of the team intro (black background).
async function buildTalkSprites() {
  const v = VID.intro, T0 = 7.30, N = Math.floor((INTRO_END - .01 - T0) * 30) + 1;
  const small = new OffscreenCanvas(480, 270), sg = small.getContext('2d', {willReadFrequently: true});
  for (let i = 0; i < N; i++) {
    await seekVideo(v, T0 + i / 30);
    sg.drawImage(v, 0, 0, 480, 270);
    const d = sg.getImageData(0, 0, 480, 270).data;
    let x0 = 1e9, y0 = 1e9, x1 = -1, y1 = -1;
    for (let y = 0; y < 270; y++) for (let x = 0; x < 480; x++) {
      const o = (y * 480 + x) * 4, r = d[o], gr = d[o + 1], b = d[o + 2];
      if (b > 90 && b > r + 40 && b > gr + 40) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    }
    const cx = x1 >= 0 ? (x0 + x1) / 2 * 4 : 960, cy = y1 >= 0 ? (y0 + y1) / 2 * 4 : 500;
    const spr = new OffscreenCanvas(480, 480), pg = spr.getContext('2d');
    pg.fillStyle = '#000'; pg.fillRect(0, 0, 480, 480);
    pg.drawImage(v, cx - 320, cy - 320, 640, 640, 0, 0, 480, 480);
    TALK.push({bmp: spr.transferToImageBitmap(), cx, cy});
  }
}
function buildQuakeEnvelope() {
  const b = BUF.quake, d = b.getChannelData(0), hop = Math.round(b.sampleRate / 30);
  for (let i = 0; i + hop <= d.length; i += hop) { let s = 0; for (let j = i; j < i + hop; j++) s += d[j] * d[j]; QUAKE_ENV.push(Math.sqrt(s / hop)); }
  const mx = Math.max(...QUAKE_ENV) || 1; for (let i = 0; i < QUAKE_ENV.length; i++) QUAKE_ENV[i] /= mx;
}

/* ---------------- sound effects ----------------
   Synthesized here (no sample libraries), so they are original, need no licence,
   and sound exactly the same in the page and in the exported MP4. */
async function synthSFX() {
  const SR = 48000, out = {};
  const mk = (ctx, dur, fn) => { const b = ctx.createBuffer(1, Math.ceil(dur * SR), SR), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = fn(i / SR, i); return b; };
  const white = seed => { const r = rng(seed); return () => r() * 2 - 1; };
  const brown = seed => { const r = white(seed); let l = 0; return () => (l = (l + .02 * r()) / 1.02) * 3.5; };
  const src = (ctx, buf) => { const s = ctx.createBufferSource(); s.buffer = buf; return s; };
  const biq = (ctx, type, f, Q = .7) => { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = Q; return b; };
  const env = (ctx, pts) => { const g = ctx.createGain(); g.gain.setValueAtTime(pts[0][1], pts[0][0]);
    for (const [t, v, e] of pts.slice(1)) e ? g.gain.exponentialRampToValueAtTime(Math.max(v, 1e-4), t) : g.gain.linearRampToValueAtTime(v, t); return g; };
  const osc = (ctx, type, pts) => { const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(pts[0][1], pts[0][0]);
    for (const [t, v] of pts.slice(1)) o.frequency.exponentialRampToValueAtTime(v, t); return o; };
  const gain = (ctx, v) => { const g = ctx.createGain(); g.gain.value = v; return g; };
  const render = async (name, dur, build) => {
    const ctx = new OfflineAudioContext(1, Math.ceil(dur * SR), SR); build(ctx, ctx.destination);
    const b = await ctx.startRendering(), d = b.getChannelData(0); let m = 0;
    for (let i = 0; i < d.length; i++) m = Math.max(m, Math.abs(d[i]));
    if (m > 0) for (let i = 0; i < d.length; i++) d[i] *= .98 / m;
    out['sfx:' + name] = b;
  };
  // soft air whoosh: band-passed noise sweeping up then down
  await render('whoosh', 1.3, (c, D) => { const n = src(c, mk(c, 1.3, white(3))), bp = biq(c, 'bandpass', 300, 1.1);
    bp.frequency.setValueAtTime(300, 0); bp.frequency.exponentialRampToValueAtTime(2200, .7); bp.frequency.exponentialRampToValueAtTime(800, 1.3);
    n.connect(bp).connect(env(c, [[0, 0], [.55, 1], [1.3, 0]])).connect(D); n.start(0); });
  // dry click, like an archive file snapping open
  await render('click', .08, (c, D) => { const n = src(c, mk(c, .08, white(5))); n.connect(biq(c, 'highpass', 2500)).connect(env(c, [[0, 0], [.002, 1], [.035, 1e-4, 1]])).connect(D); n.start(0);
    const o = osc(c, 'sine', [[0, 1900]]); o.connect(env(c, [[0, 0], [.001, .5], [.02, 1e-4, 1]])).connect(D); o.start(0); o.stop(.05); });
  // rocket rumble: low brown noise plus a band of roar
  await render('rumble', 5.0, (c, D) => { const e = env(c, [[0, 0], [.6, 1], [3.8, .9], [5.0, 0]]);
    const b = src(c, mk(c, 5, brown(7))); b.connect(biq(c, 'lowpass', 140)).connect(e);
    const w = src(c, mk(c, 5, white(8))); w.connect(biq(c, 'bandpass', 500, .5)).connect(gain(c, .45)).connect(e);
    // crackle in the mid range so small speakers can hear the rocket too
    const r = rng(41); const k = src(c, mk(c, 5, () => (r() * 2 - 1) * (r() < .04 ? 1 : .25)));
    k.connect(biq(c, 'bandpass', 1400, .7)).connect(gain(c, .35)).connect(e);
    e.connect(D); b.start(0); w.start(0); k.start(0); });
  // touchdown: falling low sine with a short burst of dirt
  await render('thump', .9, (c, D) => { const o = osc(c, 'sine', [[0, 72], [.35, 36]]); o.connect(env(c, [[0, 0], [.005, 1], [.7, 1e-4, 1]])).connect(D); o.start(0); o.stop(.9);
    const n = src(c, mk(c, .3, white(9))); n.connect(biq(c, 'bandpass', 600, .6)).connect(env(c, [[0, 0], [.003, 1], [.16, 1e-4, 1]])).connect(D); n.start(0);
    const o2 = osc(c, 'triangle', [[0, 190], [.25, 110]]); o2.connect(env(c, [[0, 0], [.004, .6], [.3, 1e-4, 1]])).connect(D); o2.start(0); o2.stop(.4); });
  await render('pop', .25, (c, D) => { const o = osc(c, 'sine', [[0, 560], [.08, 180]]); o.connect(env(c, [[0, 0], [.004, 1], [.18, 1e-4, 1]])).connect(D); o.start(0); o.stop(.25); });
  await render('plip', .32, (c, D) => { const o = osc(c, 'sine', [[0, 640], [.06, 1450]]); o.connect(env(c, [[0, 0], [.004, 1], [.24, 1e-4, 1]])).connect(D); o.start(0); o.stop(.32);
    const o2 = osc(c, 'sine', [[0, 1280], [.06, 2900]]); o2.connect(env(c, [[0, 0], [.004, .25], [.12, 1e-4, 1]])).connect(D); o2.start(0); o2.stop(.2); });
  // oven heating: thin hiss with sparse crackles
  await render('sizzle', 1.8, (c, D) => { const r = rng(11); const n = src(c, mk(c, 1.8, () => (r() * 2 - 1) * (r() < .015 ? 1 : .18)));
    n.connect(biq(c, 'highpass', 3200)).connect(env(c, [[0, 0], [.35, 1], [1.4, .8], [1.8, 0]])).connect(D); n.start(0); });
  // three scoop strokes through soil
  await render('scrape', 2.2, (c, D) => { const r = white(13), strokes = [[0, .55], [.7, 1.25], [1.42, 2.05]];
    const n = src(c, mk(c, 2.2, t => { let e = 0; for (const [a, b] of strokes) if (t >= a && t < b) e = Math.sin(Math.PI * (t - a) / (b - a)) ** 2; return r() * e * (.6 + .4 * Math.sin(t * 90)); }));
    n.connect(biq(c, 'bandpass', 1100, .9)).connect(D); n.start(0); });
  await render('rise', 2.6, (c, D) => { const e = env(c, [[0, 0], [.35, .7], [2.2, .7], [2.6, 0]]); e.connect(D);
    const o1 = osc(c, 'triangle', [[0, 220], [2.4, 440]]), o2 = osc(c, 'sine', [[0, 330], [2.4, 660]]);
    o1.connect(e); o2.connect(gain(c, .5)).connect(e); [o1, o2].forEach(o => { o.start(0); o.stop(2.6); }); });
  const bell = (name, f0, dur, parts) => render(name, dur, (c, D) => { for (const [k, amp, dec] of parts) {
    const o = osc(c, 'sine', [[0, f0 * k]]); o.connect(env(c, [[0, 0], [.004, amp], [dec, 1e-4, 1]])).connect(D); o.start(0); o.stop(dur); } });
  await bell('chime', 880, 1.6, [[1, 1, 1.4], [2.76, .45, .8], [5.4, .2, .4]]);
  await bell('chimeLow', 294, 3.0, [[1, 1, 2.8], [2, .35, 1.8], [3.01, .2, 1.0]]);
  // deep seismic rumble with a slow tremble
  await render('quake', 3.0, (c, D) => { const e = env(c, [[0, 0], [.5, 1], [2.2, .8], [3.0, 0]]), trem = gain(c, .75);
    const lfo = c.createOscillator(); lfo.frequency.value = 7; lfo.connect(gain(c, .25)).connect(trem.gain);
    const o1 = osc(c, 'sine', [[0, 34]]), o2 = osc(c, 'sine', [[0, 51]]), b = src(c, mk(c, 3, brown(17)));
    o1.connect(trem); o2.connect(gain(c, .6)).connect(trem); b.connect(biq(c, 'lowpass', 90)).connect(gain(c, .8)).connect(trem);

    const rr = src(c, mk(c, 3, white(43))); rr.connect(biq(c, 'bandpass', 450, .8)).connect(gain(c, 1.4)).connect(trem); rr.start(0);
    trem.connect(e).connect(D); [o1, o2, lfo].forEach(o => { o.start(0); o.stop(3); }); b.start(0); });
  // meteor: falling whoosh, then a muffled boom at 0.8 s
  await render('meteor', 2.2, (c, D) => { const n = src(c, mk(c, 1, white(19))), bp = biq(c, 'bandpass', 3000, 1.2);
    bp.frequency.setValueAtTime(3000, 0); bp.frequency.exponentialRampToValueAtTime(400, .8);
    n.connect(bp).connect(env(c, [[0, 0], [.55, .6], [.8, .15], [.9, 0]])).connect(D); n.start(0);
    const b = src(c, mk(c, 1.4, brown(23))); b.connect(biq(c, 'lowpass', 160)).connect(env(c, [[0, 0], [.8, 0], [.81, 1], [2.2, 1e-4, 1]])).connect(D); b.start(.8);
    const o = osc(c, 'sine', [[0, 46]]); o.connect(env(c, [[0, 0], [.8, 0], [.81, .8], [2.0, 1e-4, 1]])).connect(D); o.start(.8); o.stop(2.2);
    const cr = src(c, mk(c, 1.4, white(47))); cr.connect(biq(c, 'bandpass', 700, .6)).connect(env(c, [[0, 0], [.8, 0], [.805, 1], [1.4, 1e-4, 1]])).connect(D); cr.start(.8); });
  // camera shutter: two quick mechanical clicks
  await render('shutter', .3, (c, D) => { const r = white(29);
    const n = src(c, mk(c, .3, t => { const k = a => t >= a ? Math.exp(-(t - a) * 260) : 0; return r() * (k(0) + .8 * k(.085)); }));
    n.connect(biq(c, 'highpass', 1400)).connect(D); n.start(0);
    const o = osc(c, 'sine', [[0, 190]]); o.connect(env(c, [[0, 0], [.085, 0], [.087, .5], [.13, 1e-4, 1]])).connect(D); o.start(0); o.stop(.3); });
  // cold wind for Phoenix's winter (synthesized, not a recording)
  await render('cold', 3.4, (c, D) => { const n = src(c, mk(c, 3.4, white(31))), bp = biq(c, 'bandpass', 650, 2.5);

function trajectory(t, c, c0, c1, days, name, a = 1) {

  const u = E.io(ramp(c, c0, c1));

  stroke(3); g.beginPath(); for (let i = 0; i <= 80; i++) { const [px, py] = pt(u * i / 80); i ? g.lineTo(px, py) : g.moveTo(px, py); } g.stroke();

  items.push(`<li><b>${esc(v.title)}</b> (real data and sound) · ${esc(v.credit)} · <a href="${v.url}" target="_blank" rel="noopener">${v.id}</a></li>`);
  const wa = AUDIOS['mars-wind'];
  items.push(`<li><b>${esc(wa.title)}</b> (real recording from InSight’s air pressure sensor, sped up 100× by NASA) · ${esc(wa.credit)} · <a href="${wa.url}" target="_blank" rel="noopener">science.nasa.gov</a></li>`);
  openModal(`<h3>Sources</h3><p class="muted">Mission facts: NASA mission pages for InSight and Mars Phoenix (science.nasa.gov). Voice, intro animation and the Allinol character: our team. Other sound effects were synthesized for this project.</p><ul class="src">${items.join('')}</ul>`);
}

/* ---------------- full screen, phones, idle controls ---------------- */
const isTouch = matchMedia('(pointer: coarse)').matches;
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
const canFS = () => !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
async function toggleFullscreen() {
  if (fsEl()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
  if (document.body.classList.contains('immersive')) { setImmersive(false); return; }
  const el = $('app');
  if (canFS()) {
    try { await (el.requestFullscreen ? el.requestFullscreen({navigationUI: 'hide'}) : el.webkitRequestFullscreen()); }
    catch (e) { setImmersive(true); return; }
    try { await screen.orientation.lock('landscape'); } catch (e) {}
  } else {
    // iPhone Safari cannot put a page in full screen: hide the controls and let the picture fill the screen.
    setImmersive(true);
  }
}
function setImmersive(on) { document.body.classList.toggle('immersive', on); $('fsBtn').textContent = on ? 'Exit full screen' : 'Full screen'; poke(); fit(); }
function onFSChange() { setImmersive(!!fsEl()); }
document.addEventListener('fullscreenchange', onFSChange);
document.addEventListener('webkitfullscreenchange', onFSChange);
$('fsBtn').onclick = toggleFullscreen;
let lastPoke = 0;
function poke() { lastPoke = performance.now(); document.body.classList.remove('idle'); }
function idleCheck() {
  const imm = document.body.classList.contains('immersive');
  if (imm && P.playing && $('modal').style.display !== 'flex' && performance.now() - lastPoke > 2600) document.body.classList.add('idle');
}
['pointerdown', 'pointermove', 'keydown', 'touchstart'].forEach(ev => addEventListener(ev, poke, {passive: true}));
function rotateCheck() {
  const portrait = matchMedia('(orientation: portrait)').matches;
  $('rotateHint').style.display = isTouch && portrait && !sessionStorageGet('rotOk') ? 'flex' : 'none';
}
function sessionStorageGet(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
function sessionStorageSet(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }
$('rotateOk').onclick = () => { sessionStorageSet('rotOk', '1'); rotateCheck(); };
addEventListener('orientationchange', () => setTimeout(() => { fit(); rotateCheck(); }, 250));

/* ---------------- controls ---------------- */
$('playBtn').onclick = () => { $('overlay').style.display = 'none'; P.playing ? pause() : play(); };
$('restartBtn').onclick = () => { $('overlay').style.display = 'none'; seekTo(0); if (!P.playing) play(); };
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
$('ccBtn').onclick = e => { UI.cc = !UI.cc; e.currentTarget.setAttribute('aria-pressed', UI.cc); };
$('soundBtn').onclick = e => { UI.sound = !UI.sound; e.currentTarget.setAttribute('aria-pressed', UI.sound); if (P.master) P.master.gain.value = UI.sound ? LIVE_GAIN : 0; };
$('startBtn').onclick = () => { $('overlay').style.display = 'none'; seekTo(0); play(); if (isTouch && !fsEl()) toggleFullscreen(); };
addEventListener('keydown', e => {
  if ($('modal').style.display === 'flex') { if (e.code === 'Escape') closeModal(); return; }
  if (BUSY) return;
  if (e.code === 'Space') { e.preventDefault(); $('playBtn').click(); }
  if (e.code === 'KeyF') toggleFullscreen();
});
function fit() { const vp = $('viewport'); const s = Math.min(vp.clientWidth / W, vp.clientHeight / H); $('stageWrap').style.transform = `translate(-50%,-50%) scale(${s})`; }
addEventListener('resize', () => { fit(); rotateCheck(); }); fit(); rotateCheck();

/* ---------------- export: 1920x1080, 60 fps, H.264 + AAC (local server only) ---------------- */
const LOCAL = ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);
if (LOCAL) $('exportBtn').hidden = false;
async function renderMix(pick = () => true, normalize = true, hp = 0) {
  const sr = 48000, oc = new OfflineAudioContext(2, Math.ceil(TL.total * sr), sr);
  let dest = oc.destination;
  if (hp) {   // used only for checks: roughly what a laptop or phone speaker can play
    const f1 = oc.createBiquadFilter(), f2 = oc.createBiquadFilter(); f1.type = f2.type = 'highpass'; f1.frequency.value = f2.frequency.value = hp;
    f1.connect(f2).connect(oc.destination); dest = f1;
  }
  scheduleInto(oc, dest, 0, 0, pick);
  const buf = await oc.startRendering();
  if (normalize) {   // safety: never clip
    let m = 0; for (let ch = 0; ch < 2; ch++) { const d = buf.getChannelData(ch); for (let i = 0; i < d.length; i++) m = Math.max(m, Math.abs(d[i])); }
    if (m > .97) for (let ch = 0; ch < 2; ch++) { const d = buf.getChannelData(ch), s = .97 / m; for (let i = 0; i < d.length; i++) d[i] *= s; }
  }
  return buf;
}
function srt() {
  const ts = s => { const ms = Math.round(s * 1000), h = Math.floor(ms / 3600000), m = Math.floor(ms / 60000) % 60, sec = Math.floor(ms / 1000) % 60; return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')},${String(ms % 1000).padStart(3, '0')}`; };
  return TL.subs.map((s, i) => `${i + 1}\n${ts(s.a)} --> ${ts(s.b)}\n${s.text}\n`).join('\n');
}
async function exportMP4(onProgress, opts = {}) {
  const fps = opts.fps || FPS, from = opts.from || 0, to = Math.min(opts.to || TL.total, TL.total), N = Math.round((to - from) * fps);
  const name = opts.name || 'allinol-phoenix-insight-1080p60.mp4';
  let codec = 'avc1.64002A';
  for (const cand of ['avc1.64002A', 'avc1.640033', 'avc1.4D002A']) {
    const ok = await VideoEncoder.isConfigSupported({codec: cand, width: W, height: H, framerate: fps, bitrate: 12e6});
    if (ok.supported) { codec = cand; break; }
  }
  BUSY = true; pause(); MODE = 'export';
  let streaming = false;
  try { streaming = (await fetch('/write?reset=1&pos=0&name=' + encodeURIComponent(name), {method: 'POST', body: new Uint8Array(0)})).ok; } catch (e) { streaming = false; }
  let queue = Promise.resolve(), writeErr = null, written = 0;
  const target = streaming
    ? new Mp4Muxer.StreamTarget({chunked: true, chunkSize: 8 * 2 ** 20, onData: (data, pos) => {
        const copy = data.slice(); written = Math.max(written, pos + copy.byteLength);
        queue = queue.then(() => fetch(`/write?pos=${pos}&name=${encodeURIComponent(name)}`, {method: 'POST', body: copy}))
          .then(r => { if (!r.ok) throw new Error('write failed ' + r.status); }).catch(e => { writeErr = e; });
      }})
    : new Mp4Muxer.ArrayBufferTarget();
  const muxer = new Mp4Muxer.Muxer({target, video: {codec: 'avc', width: W, height: H, frameRate: fps},
    audio: {codec: 'aac', numberOfChannels: 2, sampleRate: 48000}, fastStart: streaming ? false : 'in-memory', firstTimestampBehavior: 'offset'});
  let err = null;
  const ve = new VideoEncoder({output: (ch, meta) => muxer.addVideoChunk(ch, meta), error: e => { err = e; }});
  ve.configure({codec, width: W, height: H, bitrate: 12e6, framerate: fps, latencyMode: 'quality', avc: {format: 'avc'}});
  const t0 = performance.now();
  try {
    for (let i = 0; i < N; i++) {
      if (err) throw err;
      const t = from + i / fps;
      await prepVideosExact(t);
      renderFrame(Math.min(t, TL.total - 1e-4));
      const fr = new VideoFrame(CANVAS, {timestamp: Math.round(i * 1e6 / fps), duration: Math.round(1e6 / fps)});
      ve.encode(fr, {keyFrame: i % (fps * 2) === 0}); fr.close();
      while (ve.encodeQueueSize > 6) await new Promise(r => ve.addEventListener('dequeue', r, {once: true}));
      if (i % 15 === 0) onProgress(.92 * i / N, `Video frame ${i} / ${N}`, (performance.now() - t0) / 1000);
    }
    await ve.flush(); ve.close();
    if (err) throw err;
    onProgress(.93, 'Mixing audio…');
    const mix = await renderMix();
    const ae = new AudioEncoder({output: (ch, meta) => muxer.addAudioChunk(ch, meta), error: e => { err = e; }});
    ae.configure({codec: 'mp4a.40.2', sampleRate: 48000, numberOfChannels: 2, bitrate: 192000});
    const L = mix.getChannelData(0), Rr = mix.getChannelData(1), s0 = Math.round(from * 48000), s1 = Math.min(mix.length, Math.round(to * 48000));
    for (let off = s0; off < s1; off += 4800) {
      const n = Math.min(4800, s1 - off), data = new Float32Array(n * 2);
      data.set(L.subarray(off, off + n), 0); data.set(Rr.subarray(off, off + n), n);
      const ad = new AudioData({format: 'f32-planar', sampleRate: 48000, numberOfFrames: n, numberOfChannels: 2, timestamp: Math.round((off - s0) * 1e6 / 48000), data});
      ae.encode(ad); ad.close();
    }
    await ae.flush(); ae.close();
    if (err) throw err;
    muxer.finalize();
    onProgress(.97, 'Saving…');
    let saved = null, bytes = 0;
    if (streaming) { await queue; if (writeErr) throw writeErr; saved = 'output/' + name; bytes = written; }
    else { const buf = target.buffer; bytes = buf.byteLength; const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([buf], {type: 'video/mp4'})); a.download = name; a.click(); saved = '(browser download) ' + name; }
    if (!opts.from && !opts.to) { try { await fetch('/save?name=' + encodeURIComponent(name.replace(/\.mp4$/, '.srt')), {method: 'POST', body: srt()}); } catch (e) {} }
    onProgress(1, 'Done', (performance.now() - t0) / 1000);
    return {saved, bytes, frames: N, codec, seconds: (performance.now() - t0) / 1000};
  } finally { BUSY = false; MODE = 'live'; }
}
$('exportBtn').onclick = async () => {
  openModal(`<h3>Exporting MP4…</h3><p class="muted">1920×1080 · 60 fps · H.264 + AAC. Keep this window open and visible until it finishes.</p><div class="progress"><div id="pb"></div></div><p id="pmsg">Starting…</p>`);
  $('modalClose').style.display = 'none';
  try {
    const r = await exportMP4((p, msg, el) => { $('pb').style.width = (p * 100).toFixed(1) + '%'; $('pmsg').textContent = msg + (el ? ` · ${el.toFixed(0)} s` : ''); });
    $('pmsg').innerHTML = `Saved: <b>${esc(r.saved)}</b> (${(r.bytes / 1e6).toFixed(1)} MB, ${r.frames} frames). Subtitles saved next to it as .srt.`;
  } catch (e) { $('pmsg').textContent = 'Export failed: ' + e.message; }
  $('modalClose').style.display = '';
};

/* ---------------- debug hooks (frame grabs for checking) ---------------- */
window.__dbg = {
  get TL() { return TL; },
  async sheet(times, name, cols = 4, w = 480) {
    BUSY = true; pause(); MODE = 'export';
    try {
      const h = Math.round(w * 9 / 16), rows = Math.ceil(times.length / cols), cv = new OffscreenCanvas(cols * w, rows * (h + 26)), x = cv.getContext('2d');
      x.fillStyle = '#111'; x.fillRect(0, 0, cv.width, cv.height);
      for (let i = 0; i < times.length; i++) {
        const t = times[i]; await prepVideosExact(t); renderFrame(t);
        const ox = (i % cols) * w, oy = Math.floor(i / cols) * (h + 26);
        x.drawImage(CANVAS, ox, oy + 26, w, h); x.fillStyle = '#fff'; x.font = '16px sans-serif'; x.fillText(`${t.toFixed(2)}s · ${TL.scenes[sceneIndexAt(t)].id}`, ox + 6, oy + 18);
      }
      const blob = await cv.convertToBlob({type: 'image/png'});
      return (await fetch('/save?dir=debug&name=' + encodeURIComponent(name), {method: 'POST', body: blob})).json();
    } finally { BUSY = false; MODE = 'live'; }
  },
  async frame(t, name) {
    BUSY = true; pause(); MODE = 'export';
    try { await prepVideosExact(t); renderFrame(t);
      const b = await new Promise(r => CANVAS.toBlob(r, 'image/jpeg', .9));
      return (await fetch('/save?dir=debug&name=' + encodeURIComponent(name), {method: 'POST', body: b})).json();
    } finally { BUSY = false; MODE = 'live'; }
  },
  exportMP4,
  srt: () => srt(),
  // Loudness check: each effect against the voice in the same 1.5 s window, and the peak of the full mix.
  async mixStats(hp = 0) {
    const isVoice = a => CLIPS[a.key] !== undefined;
    const voice = await renderMix(isVoice, false, hp), fxMix = await renderMix(a => !isVoice(a) && a.key !== 'quake', false, hp), all = await renderMix(() => true, false);
    const db = (buf, t0, t1) => { const d = buf.getChannelData(0), s0 = Math.max(0, Math.floor(t0 * 48000)), s1 = Math.min(d.length, Math.floor(t1 * 48000)); let s = 0; for (let i = s0; i < s1; i++) s += d[i] * d[i]; return 10 * Math.log10(s / Math.max(1, s1 - s0) + 1e-12); };
    const peak = buf => { let m = 0; for (let ch = 0; ch < 2; ch++) { const d = buf.getChannelData(ch); for (let i = 0; i < d.length; i++) m = Math.max(m, Math.abs(d[i])); } return m; };
    const rows = TL.audio.filter(a => !isVoice(a) && a.key !== 'quake').map(a => { const w = Math.min(a.dur, 1.5); return [a.key, +a.at.toFixed(2), +db(fxMix, a.at, a.at + w).toFixed(1), +db(voice, a.at, a.at + w).toFixed(1)]; });
    return {voiceSpeechDb: +db(voice, TL.at['05'], TL.at['05'] + 18).toFixed(1), peakAll: +peak(all).toFixed(3), rows};
  },
};

/* ---------------- boot ---------------- */
(async () => {
  try {
    await loadAll(m => { $('loadMsg').textContent = m; });
    buildChapters();
    $('loadMsg').textContent = `Ready · ${fmtTime(TL.total)}`;
    $('startBtn').disabled = false;
    requestAnimationFrame(loop);
  } catch (e) {
    console.error(e); $('loadMsg').textContent = 'Could not load: ' + e.message;
  }
})();
</script>
